<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aroma Catalogue</title>
  <style>
    :root { --bg:#faf8f5; --fg:#2b2622; --muted:#7a6f66; --card:#fff; --line:#e6dfd6; --accent:#8a4b2a; --ok:#2f7d4f; --bad:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1d1916; --fg:#f1ebe4; --muted:#a99d92; --card:#27221e; --line:#3a332d; --accent:#d58c5f; --ok:#6cc58f; --bad:#ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); }
    header h1 { font-size:18px; margin:0; color:var(--accent); }
    main { max-width:1000px; margin:20px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
    h2 { font-size:16px; margin:0 0 10px; }
    label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
    input, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
    button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
    button.secondary { background:transparent; color:var(--fg); border-color:var(--line); }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .hidden { display:none; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td input { width:90px; }
    .stats { display:flex; gap:12px; margin:10px 0; flex-wrap:wrap; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-width:110px; }
    .stat b { display:block; font-size:22px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
    #login { max-width:340px; margin:60px auto; }
    #login input { width:100%; }
  </style>
</head>
<body>
  <header>
    <h1>Aroma Catalogue</h1>
    <div id="who" class="row hidden"><span id="whoName" class="muted"></span><button class="secondary" id="logout">Sign out</button></div>
  </header>

  <section id="login" class="card">
    <h2>Merchant sign in</h2>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <p id="loginError" class="bad"></p>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <main id="dashboard" class="hidden">
    <div class="card">
      <h2>Import products (CSV)</h2>
      <p class="muted">Columns: sku, name, category, price, stock. Existing SKUs are updated, not duplicated.</p>
      <div class="row">
        <input type="file" id="file" accept=".csv,text/csv">
        <button id="importBtn">Import</button>
      </div>
      <p id="importError" class="bad"></p>
      <div id="importResult" class="hidden">
        <div class="stats">
          <div class="stat"><b id="rCreated" class="ok">0</b>created</div>
          <div class="stat"><b id="rUpdated">0</b>updated</div>
          <div class="stat"><b id="rRejected" class="bad">0</b>rejected</div>
        </div>
        <div id="rejections" class="table-wrap hidden">
          <table>
            <thead><tr><th>Row</th><th>SKU</th><th>Reason</th></tr></thead>
            <tbody id="rejectionsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Your products</h2>
      <div class="row">
        <input id="search" type="search" placeholder="Search by SKU or name" style="min-width:260px">
        <span id="count" class="muted"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="secondary" id="prev">Previous</button>
        <span id="pageInfo" class="muted"></span>
        <button class="secondary" id="next">Next</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
